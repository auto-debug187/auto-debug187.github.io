<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760"><style>.t{font:600 23px Arial;fill:#16202a}.s{font:17px Arial;fill:#4b5968}.b{fill:#fff;stroke:#2a6f77;stroke-width:3}.g{fill:#f2f8f9;stroke:#8bb8bd;stroke-width:2}.a{stroke:#2a6f77;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2a6f77"/></marker></defs><rect width="1500" height="760" fill="#f7f8fa"/><text x="750" y="55" text-anchor="middle" class="t" font-size="34">TD3 adaptive PI gain tuning</text><rect x="70" y="150" width="320" height="220" rx="18" class="g"/><text x="230" y="195" text-anchor="middle" class="t">Observation</text><text x="230" y="235" text-anchor="middle" class="s">normalized error</text><text x="230" y="267" text-anchor="middle" class="s">disturbance parameter A</text><text x="230" y="299" text-anchor="middle" class="s">integral error</text><text x="230" y="331" text-anchor="middle" class="s">error derivative</text><rect x="500" y="125" width="450" height="270" rx="18" class="b"/><text x="725" y="170" text-anchor="middle" class="t">TD3 agent</text><text x="725" y="210" text-anchor="middle" class="s">actor → gain correction factors [cKp, cKi]</text><text x="725" y="245" text-anchor="middle" class="s">twin critics + clipped double-Q</text><text x="725" y="280" text-anchor="middle" class="s">experience replay</text><text x="725" y="315" text-anchor="middle" class="s">target policy smoothing</text><text x="725" y="350" text-anchor="middle" class="s">delayed policy updates</text><rect x="1070" y="150" width="360" height="220" rx="18" class="g"/><text x="1250" y="195" text-anchor="middle" class="t">PI controller + plant</text><text x="1250" y="235" text-anchor="middle" class="s">Kp = cKp · Kp0</text><text x="1250" y="267" text-anchor="middle" class="s">Ki = cKi · Ki0</text><text x="1250" y="299" text-anchor="middle" class="s">time-varying disturbed plant</text><text x="1250" y="331" text-anchor="middle" class="s">response y(t)</text><path d="M390 260 H500" class="a"/><path d="M950 260 H1070" class="a"/><rect x="455" y="500" width="590" height="150" rx="18" class="b"/><text x="750" y="542" text-anchor="middle" class="t">Reward + curriculum</text><text x="750" y="580" text-anchor="middle" class="s">tracking + precision − error − oscillation − overshoot − undershoot</text><text x="750" y="615" text-anchor="middle" class="s">progressively vary setpoint, A and disturbance profile → randomized operating conditions</text><path d="M1250 370 C1250 465 1010 490 960 500" class="a"/><path d="M540 500 C420 470 300 430 260 370" class="a"/></svg>