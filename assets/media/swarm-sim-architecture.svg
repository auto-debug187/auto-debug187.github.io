<path d="M715 280 C715 330 750 345 750 400" class="a"/>
<rect x="360" y="660" width="780" height="95" rx="18" class="b"/><text x="750" y="700" text-anchor="middle" class="t">Validation + metrics</text><text x="750" y="732" text-anchor="middle" class="s">trajectory tracking • separation / collision • mission success • frame consistency • planner runtime</text>
<path d="M750 575 V660" class="a"/>
