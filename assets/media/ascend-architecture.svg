<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1030">
<style>.t{font:600 23px Arial;fill:#16202a}.s{font:17px Arial;fill:#4b5968}.b{fill:#fff;stroke:#2a6f77;stroke-width:3}.g{fill:#f2f8f9;stroke:#8bb8bd;stroke-width:2}.o{fill:#fff8ee;stroke:#d59b43;stroke-width:2}.a{stroke:#2a6f77;stroke-width:4;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2a6f77"/></marker></defs>
<rect width="1600" height="1030" fill="#f7f8fa"/>
<text x="800" y="50" text-anchor="middle" class="t" font-size="34">ASCEND perception pipeline</text>
<rect x="60" y="110" width="310" height="150" rx="18" class="o"/><text x="215" y="150" text-anchor="middle" class="t">Reference features</text><text x="215" y="188" text-anchor="middle" class="s">64 × 64 templates</text><text x="215" y="218" text-anchor="middle" class="s">DINOv2 patch embeddings</text><text x="215" y="245" text-anchor="middle" class="s">attention + hue signature</text>
<rect x="60" y="360" width="310" height="170" rx="18" class="o"/><text x="215" y="400" text-anchor="middle" class="t">Sortie imagery</text><text x="215" y="438" text-anchor="middle" class="s">image frames + pose YAML</text><text x="215" y="468" text-anchor="middle" class="s">camera calibration</text><text x="215" y="498" text-anchor="middle" class="s">/transfer_status triggers</text>
<rect x="450" y="330" width="300" height="220" rx="18" class="g"/><text x="600" y="372" text-anchor="middle" class="t">Frame selection</text><text x="600" y="410" text-anchor="middle" class="s">group images by stop</text><text x="600" y="440" text-anchor="middle" class="s">Laplacian sharpness score</text><text x="600" y="470" text-anchor="middle" class="s">keep four sharpest frames</text><text x="600" y="500" text-anchor="middle" class="s">altitude-aware resizing</text>
