<rect x="860" y="700" width="330" height="205" rx="18" class="g"/><text x="1025" y="742" text-anchor="middle" class="t">ROS 2 outputs</text><text x="1025" y="782" text-anchor="middle" class="s">PoseArray in map frame</text><text x="1025" y="814" text-anchor="middle" class="s">status / progress / result topics</text><text x="1025" y="846" text-anchor="middle" class="s">continuous coordinate publishing</text><text x="1025" y="878" text-anchor="middle" class="s">matched_coordinates.yml</text>
