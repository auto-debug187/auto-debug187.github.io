<rect x="1240" y="320" width="300" height="245" rx="18" class="g"/><text x="1390" y="362" text-anchor="middle" class="t">Geometry</text><text x="1390" y="402" text-anchor="middle" class="s">bbox centroid (u,v)</text><text x="1390" y="434" text-anchor="middle" class="s">camera intrinsics + altitude</text><text x="1390" y="466" text-anchor="middle" class="s">vehicle base x,y</text><text x="1390" y="498" text-anchor="middle" class="s">global feature coordinates</text><text x="1390" y="530" text-anchor="middle" class="s">optimal inspection altitude</text>
